<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Gateway - Secure Checkout</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f7fa; margin:0; padding:0; }
    .wrap { max-width:560px; margin:40px auto; background:#fff; border-radius:8px;
            border:1px solid #e1e5ea; padding:32px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    h1 { font-size:22px; color:#1a2b3c; }
    p  { font-size:15px; color:#33475b; line-height:1.6; }
    .badge { display:inline-block; background:#eaf4ff; color:#0b5bb0; border-radius:4px;
             padding:4px 10px; font-size:13px; margin-bottom:12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Secure Payment Gateway · FPX · DuitNow</span>
    <h1>Pending Payment Verification</h1>
    <p>I am a payment gateway. I may be FPX. I may be DuitNow.</p>
    <p>Before this transaction can be finalised, the transaction report must be reviewed.
       Please proceed by clicking the button below to complete the verification step.</p>
    <p><a href="/gateway.html"><button style="padding:12px 24px;font-size:15px;background:#0b5bb0;color:#fff;border:none;border-radius:6px;cursor:pointer;">Continue to Verification</button></a></p>
  </div>
</body>
</html>
